services:
  laravel:
    build:
      context: ./api
    container_name: moonery-laravel
    volumes:
      - ./api:/var/www
    networks:
      - api-network
      - db-network
      - rabbitmq-network
    depends_on:
      - postgres
    ports:
      - "9000:9000"

  nginx:
    build:
      context: ./api/.docker/nginx
    container_name: moonery-nginx
    volumes:
      - ./api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - laravel
    networks:
      - api-network

  postgres:
    image: postgres:15
    container_name: moonery-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-moonery}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - db-network

  adminer:
    image: adminer
    container_name: moonery-adminer
    ports:
      - "8081:8080"
    networks:
      - db-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: moonery-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rabbitmq-network

  email-consumer:
    build:
      context: ./api
    container_name: moonery-email-consumer
    command: php artisan customs:consume-emails
    restart: unless-stopped
    volumes:
      - ./api:/var/www
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - api-network
      - db-network
      - rabbitmq-network

  frontend:
    image: node:20-alpine
    container_name: moonery-frontend
    working_dir: /app
    command: sh -c "npm install && npm run serve -- --host 0.0.0.0 --port 8082"
    volumes:
      - ./frontend:/app
    ports:
      - "8082:8082"
    depends_on:
      - nginx
    networks:
      - api-network

  mailpit:
    image: axllent/mailpit
    container_name: moonery-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - api-network

  hyperf:
    build:
      context: ./websocket-api
    container_name: moonery-hyperf
    working_dir: /data/project
    command: php bin/hyperf.php start
    restart: unless-stopped
    volumes:
      - ./websocket-api:/data/project
    ports:
      - "9501:9501"
      - "9502:9502"
    tty: true
    stdin_open: true
    depends_on:
      - postgres
      - rabbitmq
    privileged: true
    user: root
    networks:
      - api-network
      - rabbitmq-network
      - db-network

volumes:
  postgres-data:
  rabbitmq-data:

networks:
  db-network:
    driver: bridge
  rabbitmq-network:
    driver: bridge
  api-network:
    driver: bridge